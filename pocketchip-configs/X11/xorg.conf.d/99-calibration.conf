# PocketCHIP resistive touchscreen (SoC RTP, sun4i-ts) calibration.
#
# The mainline sun4i-ts driver does NOT honour the DT touchscreen-inverted-x/y
# properties (it never calls touchscreen_parse_properties), and trixie drives the
# panel with xserver-xorg-input-libinput, not evdev -- so the old evdev-style
# "Calibration"/"SwapAxes" options were silently ignored, leaving the panel
# reporting raw ADC coordinates rotated 180 deg from the display (finger down =>
# pointer up, left => right).
#
# libinput takes a 3x3 affine "Calibration Matrix" in normalised [0,1] device
# space. The matrix below flips both axes AND scales/offsets Y so the touch area
# lines up with the panel's active area -- the tuned values from the
# pocketchip-debian-builder project (a plain "-1 0 1 0 -1 1 0 0 1" 180 flip works
# but is slightly off vertically).
Section "InputClass"
        Identifier "PocketCHIP touchscreen calibration"
        MatchProduct "1c25000.rtp"
        MatchIsTouchscreen "on"
        MatchDriver "libinput"
        Option "CalibrationMatrix" "-1 0 1 0 -1.18 1.09 0 0 1"
EndSection

# The rtp also exposes a legacy /dev/input/mouse* compatibility node; ignore it so
# the touchscreen isn't double-handled as a relative mouse.
Section "InputClass"
        Identifier "Ignore PocketCHIP touchscreen mouse node"
        MatchProduct "1c25000.rtp"
        MatchDevicePath "/dev/input/mouse*"
        Option "Ignore" "true"
EndSection

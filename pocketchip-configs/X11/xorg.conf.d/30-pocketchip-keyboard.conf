# Load the PocketCHIP XKB layout for the built-in keyboard at X server start.
#
# The layout ships in this package at /usr/share/X11/xkb/symbols/pocketchip and
# puts F1-F11 etc. on the level-3 (Fn) layer -- Fn is KEY_RIGHTALT in the DIP
# overlay, and the layout's `level3(ralt_switch)` makes it the level-3 switch.
#
# awesome's rc.lua also runs `setxkbmap pocketchip`, but doing it here makes the
# function keys work regardless of the window manager / session (e.g. if the WM
# config ever fails to load), which is how they came to be dead before.
Section "InputClass"
        Identifier "PocketCHIP keyboard layout"
        MatchIsKeyboard "on"
        Option "XkbLayout" "pocketchip"
EndSection

# On the PocketCHIP the power button is the "HOME" key, not a shutdown key.
# The awesome config in this package (skel/.config/awesome/rc.lua) binds
# XF86PowerOff -> focus_home_screen (raises pocket-home). But systemd-logind
# also watches KEY_POWER and, by its compiled default HandlePowerKey=poweroff,
# shuts the device down on a short press -- which wins, so a tap powers off
# instead of going home. Tell logind to leave the key to the window manager.
#
# Powering off is still available: hold the button several seconds and the
# AXP209 PMIC hard-powers-off in hardware (independent of logind), which is how
# it always worked on the original image. HandlePowerKeyLongPress=ignore is set
# explicitly so a future systemd default can't reintroduce a software poweroff.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
